# SonarCloud configuration for iot-dashboard (see SonarCloud tutorial).
# Project key / organization are public identifiers, safe to commit.
# Secrets (SONAR_TOKEN) stay in GitHub Actions secrets / local .secrets.
sonar.projectKey=Mooncake911_iot-dashboard
sonar.organization=mooncake911

sonar.sources=src
sonar.exclusions=**/*.test.tsx,**/*.test.ts,vite.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Fail the scan step itself on red quality gate (Lab 4 requirement).
sonar.qualitygate.wait=true
